version: "3.8"
services:
  calendar-maker:
    build: .
    container_name: calendar-maker
    ports:
      - "8080:8080"
    environment:
      - DATA_PATH=/data
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
    volumes:
      - calendar_data:/data
    restart: unless-stopped

volumes:
  calendar_data:
